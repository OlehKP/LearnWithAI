<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vue</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  </head>
  <body>
    <div id="app">
      <button v-on:click="seyHello()">Hello</button>
    </div>
  </body>
  <script>
    const { createApp } = Vue;

    createApp({
      setup() {
        function seyHello() {
          alert("Ich lerne Vue!");
        }

        return {
          seyHello,
        };
      },
    }).mount("#app");
  </script>
</html>
