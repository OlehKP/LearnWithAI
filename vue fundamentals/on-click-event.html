<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vue</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  </head>
  <body>
    <div id="app">
      <button @click="sayHello('Oleh')">Oleh</button>
      <button @click="sayHello('Jonas')">Jonas</button>
    </div>
    <script>
      const { createApp } = Vue;

      createApp({
        setup() {
          function sayHello(name) {
            alert("Hallo " + name + "!");
          }

          return {
            sayHello,
          };
        },
      }).mount("#app");
    </script>
  </body>
</html>
