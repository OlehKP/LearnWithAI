<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile Editor</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  </head>
  <body>
    <div id="app">
      <label for="firstName">First Name: </label>
      <input id="firstName" type="text" v-model.trim="person.firstName" />
      <br />
      <br />
      <label for="lastName">Last Name:</label>
      <input id="lastName" type="text" v-model.trim="person.lastName" />
      <br /><br />
      <label for="age">Age: </label>
      <input id="age" type="text" v-model.number="person.age" />
      <p>
        Age Next Year: {{ typeof(person.age) ==="number" ? person.age + 1 : ""
        }}
      </p>
      <p>Full Name: {{person.firstName}} {{person.lastName}}</p>
      <label for="Bio">Bio</label>
      <input id="Bio" type="text" v-model.lazy="person.bio" /><br />
      <br />
      <p>Bio Preview: {{person.bio}}</p>

      <button @click="resetName">Reset</button><br /><br />
    </div>
    <script>
      const { createApp, reactive } = Vue;

      createApp({
        setup() {
          const person = reactive({
            firstName: "",
            lastName: "",
            age: "",
            bio: "",
          });
          function resetName() {
            person.firstName = "";
            person.lastName = "";
            person.age = "";
            person.bio = "";
          }

          return {
            person,
            resetName,
          };
        },
      }).mount("#app");
    </script>
  </body>
</html>
