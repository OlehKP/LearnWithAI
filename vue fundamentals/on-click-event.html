<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vue</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  </head>
  <body>
    <div id="app">
      <form @submit.prevent="showInputName">
        <input
          type="text"
          @input="saveInputName"
          @keydown.esc="clearInputField"
          @keyup.enter="showInputName"
        />
        <button type="submit">Привітатися</button>
      </form>
    </div>
    <script>
      const { createApp } = Vue;
      let inputValue = "";
      function saveInputName(event) {
        inputValue = event.target.value;
      }
      function showInputName() {
        if (inputValue.trim() !== "") {
          alert(inputValue);
        }
      }
      function clearInputField(event) {
        event.target.value = "";
        inputValue = "";
      }
      createApp({
        setup() {
          return {
            saveInputName,
            showInputName,
            clearInputField,
          };
        },
      }).mount("#app");
    </script>
  </body>
</html>
