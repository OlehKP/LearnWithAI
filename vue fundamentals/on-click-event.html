<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vue</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  </head>
  <body>
    <div id="app">
      <a href="https://vuejs.org" @click.prevent="showAlert()">Посилання</a>
    </div>
    <script>
      const { createApp } = Vue;

      createApp({
        setup() {
          let hasShown = false;
          function showAlert() {
            if (hasShown == false) {
              alert("Ich lerne Vue!");
              hasShown = true;
            }
          }
          return {
            showAlert,
          };
        },
      }).mount("#app");
    </script>
  </body>
</html>
