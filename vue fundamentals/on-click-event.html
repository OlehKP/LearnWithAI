<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Profile</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  </head>
  <body>
    <div id="app">
      <p>Name: {{user.name}}</p>
      <p>Age: {{user.age}}</p>
      <button @click="changeBirthday">Birthday</button>
      <button @click="changeName">Change Name</button>
      <button @click="reset">Reset</button>
    </div>
    <script>
      const { createApp, ref } = Vue;

      createApp({
        setup() {
          const user = ref({
            name: "Oleh",
            age: 19,
          });
          function changeBirthday() {
            user.value.age++;
          }
          function changeName() {
            user.value.name = "Jonas";
          }
          function reset() {
            user.value.name = "Oleh";
            user.value.age = 19;
          }

          return {
            user,
            changeBirthday,
            changeName,
            reset,
          };
        },
      }).mount("#app");
    </script>
  </body>
</html>
