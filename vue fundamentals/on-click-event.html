<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vue</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  </head>
  <body>
    <div id="app">
      <h2>{{count}}</h2>
      <button @click="increase">+</button>
      <button @click="reduce">-</button>
      <button @click="increaseLater">+1 через 2 секунди</button>
      <button @click="clearCount">clear</button>
    </div>
    <script>
      const { createApp, ref } = Vue;

      createApp({
        setup() {
          const count = ref(0);
          function increaseLater() {
            setTimeout(() => {
              count.value++;
            }, 2000);
          }
          function increase() {
            count.value++;
          }
          function reduce() {
            count.value--;
          }
          function clearCount() {
            count.value = 0;
          }

          return {
            count,
            increase,
            reduce,
            clearCount,
            increaseLater,
          };
        },
      }).mount("#app");
    </script>
  </body>
</html>
