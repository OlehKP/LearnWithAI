<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vue</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  </head>
  <body>
    <div id="app">
      <input
        type="text"
        @keydown.enter="showText($event)"
        @keydown.esc="clearText($event)"
      />
    </div>
    <script>
      const { createApp } = Vue;

      createApp({
        setup() {
          function showText(event) {
            console.log(event.target.value);
          }
          function clearText(event) {
            event.target.value = "";
          }
          return {
            showText,
            clearText,
          };
        },
      }).mount("#app");
    </script>
  </body>
</html>
